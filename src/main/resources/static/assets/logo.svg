<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 40" fill="none">
  <g>
    <!-- Icon: stacked data bars -->
    <rect x="2" y="18" width="6" height="16" rx="1.5" fill="#4F46E5"/>
    <rect x="10" y="10" width="6" height="24" rx="1.5" fill="#6366F1"/>
    <rect x="18" y="4" width="6" height="30" rx="1.5" fill="#4F46E5"/>
    <!-- Lens circle overlay -->
