server.port=8080
spring.datasource.url=jdbc:h2:file:./data/datalens_db;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=${DATALENS_MAX_UPLOAD_SIZE:50MB}
spring.servlet.multipart.max-request-size=${DATALENS_MAX_REQUEST_SIZE:50MB}
datalens.retention.days=${DATALENS_RETENTION_DAYS:0}
datalens.retention.cron=0 0 3 * * *
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent
logging.level.com.datalens=INFO
logging.level.org.hibernate.tool.schema=ERROR
